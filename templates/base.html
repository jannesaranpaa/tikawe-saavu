<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}{% endblock %} - Saavu</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<nav>
    <div class="nav-content">
        <a href="/" class="heading">Saavu</a>
        <ul>
            {% if session.user_id %}
            <li>
                <details class="dropdown">
                    <summary class="primary">Welcome, {{ session.username }}!</summary>
                    <ul class="dropdown-content">
                        <li><a href="{{ url_for('profile') }}">My Profile & Stats</a></li>
                        <li><a href="{{ url_for('logout') }}">Log Out</a></li>
                    </ul>
                </details>
            </li>
            {% else %}
            <li><a href="{{ url_for('login') }}">Login</a></li>
            {% endif %}
        </ul>
    </div>
</nav>
<main>
    <div class="toast-container">
    {% for message in get_flashed_messages() %}
      <input type="checkbox" id="toast-{{ loop.index }}" class="toast-toggle">
      
      <div class="flash-content">
        <span>{{ message }}</span>
        <label for="toast-{{ loop.index }}" class="toast-close">&times;</label>
      </div>
    {% endfor %}
  </div>
  <header>
    {% block header %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
</main>
